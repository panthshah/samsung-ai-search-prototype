<title>Samsung AI Search</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Outfit:wght@700&display=swap");
/* Layout: samsung.com shell (GNB, search popup, search results page) with an AI answer module above the existing results grid and a pinned ask bar. Single light theme, matching the live site. */
:root{
  --black:#000; --white:#fff; --gray-text:#555; --disabled:#757575; --stroke:#8F8F8F;
  --divider:#DDDDDD; --fill:#EEEEEE; --bg-gray:#F7F7F7; --snack:#313131;
  --blue:#2189FF; --blue-press:#006BEA; --blue-tint:#EAF3FF; --sale:#D6001C;
  --display:"Samsung Sharp Sans","SamsungSharpSans","Outfit",system-ui,sans-serif;
  --body:"SamsungOne","Samsung One","Noto Sans",system-ui,sans-serif;
  --r-chip:4px; --r-card:8px; --r-btn:20px; --r-pop:24px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--white);color:var(--black)}
body{font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-inline:24px}
@media (max-width:760px){.wrap{padding-inline:16px}}

/* prototype strip (not part of samsung.com) */
.proto{background:#111;color:#cfcfcf;font-size:12px}
.proto .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:7px}
.proto b{color:#fff;font-weight:700;margin-right:4px}
.proto button{background:#2a2a2a;border:1px solid #3a3a3a;color:#eee;border-radius:14px;padding:3px 10px;font-size:12px}
.proto button:hover{background:#3a3a3a}
.proto .notes{margin-left:auto;background:var(--blue);border-color:var(--blue);color:#fff}
@media (max-width:760px){.proto .notes{margin-left:0}}

/* GNB */
.util{font-size:12px;display:flex;justify-content:flex-end;gap:18px;padding-top:8px}
.gnb{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--white);border-bottom:1px solid var(--divider)}
.gnb-row{display:flex;align-items:center;gap:28px;height:56px}
.logo{font-family:var(--display);font-weight:800;letter-spacing:.18em;font-size:21px;background:none;border:0;padding:0}
.nav{display:flex;gap:22px;font-weight:700;font-size:13.5px;flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.nav span{cursor:pointer}
.icons{display:flex;gap:16px;align-items:center;margin-left:auto}
.ibtn{background:none;border:0;padding:6px;display:grid;place-items:center;border-radius:50%}
.ibtn:hover{background:var(--fill)}
.ibtn svg{width:22px;height:22px}
.burger{display:none}
@media (max-width:1000px){.nav{display:none}.util{display:none}.burger{display:grid}}

/* search popup (unchanged from live site) */
.pop-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
.pop{position:fixed;left:0;right:0;top:0;background:var(--white);z-index:51;padding-block:28px 40px;max-height:100%;overflow:auto;animation:drop .22s ease-out}
@keyframes drop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.pop-head{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--divider);padding-bottom:16px}
.pop-head svg{width:30px;height:30px;flex:none}
.pop-head input{flex:1;min-width:0;border:0;outline:0;font-family:var(--display);font-weight:600;font-size:40px;color:var(--black);background:transparent}
.pop-head input::placeholder{color:#777}
.pop-body{display:grid;grid-template-columns:minmax(200px,26%) 1fr;gap:32px;padding-top:26px}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--gray-text);text-transform:uppercase;margin:0 0 14px}
.recent{display:inline-flex;align-items:center;gap:8px;background:var(--bg-gray);border-radius:20px;padding:8px 14px;border:0;font-size:14px}
.recent i{font-style:normal;color:#888}
.recs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rec{background:none;border:0;padding:0;text-align:left}
.rec .im{background:var(--bg-gray);border-radius:var(--r-card);aspect-ratio:1;display:grid;place-items:center;max-width:100%}
.rec .im svg{width:70%;height:70%}
.rec b{display:block;font-family:var(--display);font-size:18px;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec span{font-weight:700;font-size:16px}
.sugg{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.sugg button{width:100%;text-align:left;background:none;border:0;padding:9px 6px;font-size:17px;display:flex;gap:10px;align-items:center;border-radius:6px}
.sugg button:hover,.sugg button.on{background:var(--bg-gray)}
.sugg mark{background:none;font-weight:700;color:#000}
.sugg .ask{color:var(--blue-press)}
.sugg svg{width:16px;height:16px;flex:none}
@media (max-width:760px){
  .pop{bottom:0;padding-block:16px 24px}
  .pop-head input{font-size:24px}
  .pop-body{grid-template-columns:1fr}
  .recs{grid-template-columns:repeat(2,1fr)}
  .rec b{font-size:15px}
}

/* home */
.hero{background:linear-gradient(160deg,#0d0f14,#1e2633 70%,#2e3a4d);color:#fff;border-radius:0;padding-block:64px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.hero h1{font-family:var(--display);font-size:clamp(34px,5vw,60px);line-height:1.05;margin:0 0 12px;text-wrap:balance}
.hero p{font-size:17px;opacity:.85;margin:0 0 22px}
.hero .art svg{width:100%;max-height:340px}
.btn{height:39px;border-radius:var(--r-btn);padding:0 22px;font-weight:700;font-size:14px;border:1px solid var(--black);background:var(--white);color:var(--black);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.fill{background:var(--black);color:var(--white)}
.btn.inv{background:#fff;color:#000;border-color:#fff}
.btn.ghost-inv{background:transparent;color:#fff;border-color:#fff}
.btn:hover{opacity:.85}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding-block:40px}
.cat{background:var(--bg-gray);border-radius:16px;padding:18px 12px;text-align:center;border:0;font-weight:700}
.cat svg{width:64px;height:64px;display:block;margin:0 auto 8px}
.home-hint{padding-block:0 60px;color:var(--gray-text)}
@media (max-width:760px){.hero .wrap{grid-template-columns:1fr}.cats{grid-template-columns:repeat(3,1fr)}}

/* search page */
.sp-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:16px;padding-top:18px;border-bottom:1px solid var(--divider)}
.sp-top .rf{padding-bottom:14px;font-size:14px;min-width:0}
.sp-top .rf b{font-weight:700}
.tabs{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:12px 0;font-weight:700;font-size:15px;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{border-color:var(--black)}
.tab:hover{color:var(--gray-text)}
@media (max-width:760px){.sp-top{grid-template-columns:1fr}.sp-top .rf{padding-bottom:0}.tab{font-size:14px}}

/* AI module */
.ai{margin-top:20px;background:var(--bg-gray);border-radius:var(--r-pop);padding:24px 28px 22px;position:relative}
.ai-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.spark{width:20px;height:20px;flex:none}
.beta{font-size:11px;font-weight:700;border:1px solid var(--stroke);border-radius:var(--r-chip);padding:0 5px;color:var(--gray-text)}
.ai-head .tools{margin-left:auto;display:flex;gap:12px;align-items:center}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;font-size:13px;font-weight:700}
.tip{position:relative}
.tip-box{position:absolute;right:0;top:26px;width:300px;max-width:80vw;background:var(--white);border:1px solid rgba(0,0,0,.15);border-radius:6px;padding:10px 12px;font-size:12px;font-weight:400;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.ai-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:40px;margin-top:14px}
@media (max-width:1000px){.ai-grid{grid-template-columns:minmax(0,1fr);gap:22px}}
@media (max-width:760px){.ai{padding:18px 16px;border-radius:16px;margin-inline:-4px}}
.history{display:grid;gap:6px;margin-bottom:14px}
.hist{background:var(--white);border:1px solid var(--divider);border-radius:var(--r-card);padding:8px 12px;text-align:left;font-size:13px;display:flex;gap:10px;align-items:baseline;width:100%}
.hist b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.hist span{color:var(--gray-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.q{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.2;margin:0 0 12px;text-wrap:balance}
.lead{font-size:19px;line-height:1.55;margin:0;max-width:68ch}
.lead strong{font-weight:700}
.cursor{display:inline-block;width:8px;height:18px;background:var(--blue);vertical-align:-3px;margin-left:2px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.thinking{display:grid;gap:7px;margin:4px 0 6px}
.think{display:flex;gap:9px;align-items:center;font-size:14px;color:var(--gray-text)}
.think .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--divider);border-top-color:var(--blue);animation:spin .8s linear infinite}
.think.done .dot{animation:none;border:0;background:var(--black);display:grid;place-items:center}
.think.done .dot::after{content:"";width:7px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
@keyframes spin{to{transform:rotate(360deg)}}
.lin{height:4px;background:var(--divider);border-radius:2px;overflow:hidden;margin:2px 0 10px;max-width:420px}
.lin i{display:block;height:100%;width:40%;background:var(--blue);animation:ind 1.1s ease-in-out infinite}
@keyframes ind{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.bul{margin:14px 0 0;padding-left:20px;display:grid;gap:8px;font-size:15.5px;max-width:68ch}
.bul li::marker{color:var(--stroke)}
.reveal{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.picks-h{font-weight:700;font-size:14px;margin:22px 0 10px}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.picks{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.picks>*{scroll-snap-align:start}}
.pick{background:var(--white);border-radius:16px;padding:14px;display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;border:1px solid transparent;text-align:left;align-items:start}
.pick:hover{border-color:var(--black)}
.pick .im{background:var(--bg-gray);border-radius:var(--r-card);aspect-ratio:1;display:grid;place-items:center}
.pick .im svg{width:78%;height:78%}
.tag{display:inline-block;color:var(--blue-press);font-weight:700;font-size:12px;background:var(--blue-tint);border-radius:var(--r-chip);padding:2px 6px;margin-bottom:5px}
.pick h4{margin:0;font-size:14px;line-height:1.3;font-weight:700}
.pick .why{font-size:12.5px;color:var(--gray-text);margin:4px 0 6px}
.pick .pr{font-weight:700}
.pick .pr s{font-weight:400;color:var(--disabled);font-size:12px;margin-left:4px}
.spec-wrap{overflow-x:auto;margin-top:18px;border-radius:var(--r-card)}
table.spec{border-collapse:separate;border-spacing:0;width:100%;min-width:520px;font-size:14.5px}
table.spec th,table.spec td{padding:12px 14px;text-align:left;vertical-align:top}
table.spec thead th{font-weight:700;background:var(--white);border-bottom:1px solid var(--divider)}
table.spec tbody tr:nth-child(odd) td,table.spec tbody tr:nth-child(odd) th{background:var(--white)}
table.spec tbody tr:nth-child(even) td,table.spec tbody tr:nth-child(even) th{background:var(--bg-gray)}
table.spec tbody th{font-weight:700;width:150px}
table.spec .win{font-weight:700}
table.spec .win::after{content:" ●";color:var(--blue);font-size:10px;vertical-align:2px}
.reviews{display:grid;gap:10px;margin-top:16px;max-width:560px}
.rv{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.rv .bar{height:4px;background:var(--divider);border-radius:2px;overflow:hidden}
.rv .bar i{display:block;height:100%;background:var(--blue)}
.rv em{font-style:normal;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.quote{margin:14px 0 0;padding:12px 14px;background:var(--white);border-radius:var(--r-card);font-size:14px;max-width:560px}
.quote cite{display:block;font-style:normal;color:var(--gray-text);font-size:12px;margin-top:4px}
.stepper{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:0;max-width:620px}
.stepper li{display:grid;grid-template-columns:24px 1fr;gap:12px;position:relative;padding-bottom:16px}
.stepper li:not(:last-child)::before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--divider)}
.stepper .n{width:24px;height:24px;border-radius:50%;background:var(--stroke);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.stepper li.cur .n{background:var(--blue-press)}
.stepper li.ok .n{background:var(--black)}
.stepper li.cur b{font-weight:700}
.stepper p{margin:2px 0 0;color:var(--gray-text);font-size:14px}
.fixq{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-weight:700}
.handoff{margin-top:16px;background:var(--white);border-radius:16px;padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;max-width:640px}
.handoff .av{width:44px;height:44px;border-radius:50%;background:var(--black);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.handoff .tx{flex:1;min-width:200px}
.handoff .tx b{display:block}
.handoff .tx span{color:var(--gray-text);font-size:13px}
.handoff .act{display:flex;gap:8px;flex-wrap:wrap}
.src{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:18px;font-size:12.5px}
.src b{font-weight:700;margin-right:2px}
.src a{background:var(--white);border:1px solid var(--divider);border-radius:14px;padding:3px 10px;text-decoration:none}
.src a:hover{border-color:var(--black)}
.foot{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--gray-text)}
.thumb{background:var(--white);border:1px solid var(--divider);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;padding:0}
.thumb svg{width:15px;height:15px}
.thumb.on{background:var(--black);border-color:var(--black);color:#fff}
.side h5{font-size:14px;font-weight:700;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--white);border:1px solid var(--divider);border-radius:20px;padding:8px 14px;font-size:14px;text-align:left;line-height:1.3}
.chip:hover{border-color:var(--black)}
.side .chips{flex-direction:column;align-items:stretch}
.side .chip{border-radius:12px;display:flex;gap:8px;align-items:center}
.side .chip svg{width:14px;height:14px;flex:none;color:var(--blue-press)}
.side .human{margin-top:18px;padding-top:14px;border-top:1px solid var(--divider);font-size:13px}
.ai-mini{margin-top:20px;background:var(--bg-gray);border-radius:16px;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ai-mini b{font-weight:700}
.ai-mini .chips{flex:1}
.collapsed-ai{margin-top:20px;display:flex;gap:10px;align-items:center;background:var(--bg-gray);border-radius:16px;padding:12px 18px;font-weight:700;width:100%;border:0;text-align:left}

/* results */
.res-bar{display:flex;align-items:center;gap:16px;padding-block:22px 10px}
.res-bar .fl{font-weight:700;background:none;border:0;padding:0;display:flex;gap:6px;align-items:center}
.res-bar .count{font-weight:700}
.res-bar .sort{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:700}
.res-bar select{font-family:inherit;font-size:14px;border:0;background:none;font-weight:400;padding:4px}
.applied{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:12px}
.applied:empty{display:none}
.applied .lbl{font-size:12.5px;color:var(--gray-text);display:flex;gap:5px;align-items:center}
.applied .lbl svg{width:13px;height:13px}
.fchip{border:1px solid var(--black);border-radius:var(--r-chip);padding:4px 8px;font-size:13px;font-weight:700;background:var(--white);display:inline-flex;gap:6px;align-items:center}
.fchip i{font-style:normal;font-weight:400}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;padding-bottom:140px}
.filters{font-size:14px}
.fg{border-top:1px solid var(--divider);padding-block:14px}
.fg:first-child{border-top:0;padding-top:0}
.fg h6{margin:0 0 10px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;display:flex;justify-content:space-between}
.cb{display:flex;gap:10px;align-items:center;padding:5px 0;cursor:pointer}
.cb input{appearance:none;width:20px;height:20px;border:1px solid var(--stroke);border-radius:4px;margin:0;display:grid;place-items:center;background:var(--white);flex:none}
.cb input:checked{background:var(--black);border-color:var(--black)}
.cb input:checked::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.cb small{color:var(--disabled);margin-left:auto}
.range input{width:100%;accent-color:var(--black)}
.range .vals{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.range .vals span{border:1px solid var(--divider);border-radius:var(--r-chip);padding:5px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.sheet-head{display:none}
@media (max-width:1000px){
  .layout{grid-template-columns:1fr}
  .filters{display:none}
  .filters.open{display:block;position:fixed;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:var(--white);z-index:60;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.2)}
  .filters.open .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .sheet-head b{font-family:var(--display);font-size:20px}
}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 20px}
@media (max-width:1200px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{gap:28px 12px}}
.pcard{display:flex;flex-direction:column;gap:6px;min-width:0;border-radius:var(--r-card);transition:box-shadow .3s}
.pcard.flash{box-shadow:0 0 0 2px var(--blue);}
.pcard .im{background:var(--bg-gray);border-radius:var(--r-card);aspect-ratio:1;display:grid;place-items:center;position:relative;margin-bottom:10px}
.pcard .im svg{width:62%;height:62%}
.pcard .im .tag{position:absolute;left:10px;top:10px;margin:0;background:var(--white)}
.pcard h3{margin:0;font-size:17px;line-height:1.3;font-weight:700}
.pcard .sub{margin:0;color:var(--black);font-size:13.5px}
.pcard .rt{font-size:13px;display:flex;gap:4px;align-items:center}
.pcard .rt svg{width:13px;height:13px}
.pcard .clr{font-size:12px;color:var(--gray-text);margin-top:8px}
.sw{display:flex;gap:8px}
.sw i{width:24px;height:24px;border-radius:50%;border:1px solid var(--divider);display:block}
.sw i.on{box-shadow:0 0 0 2px var(--white),0 0 0 3px var(--black)}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.opt{border:1px solid var(--divider);border-radius:var(--r-chip);padding:5px 8px;font-size:12px;background:var(--white)}
.opt.on{border-color:var(--black);font-weight:700}
.price{font-weight:700;font-size:18px;margin-top:8px}
.price s{font-weight:400;font-size:13px;color:var(--disabled);margin-left:4px}
.price em{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--sale)}
.sku{font-size:11px;color:var(--disabled)}
.pcard .btn{width:100%;margin-top:4px}
.pcard .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;gap:8px;flex-wrap:wrap}
.pcard .row a{font-weight:700}
.cmp{display:flex;gap:6px;align-items:center;cursor:pointer}
.cmp input{appearance:none;width:18px;height:18px;border:1px solid var(--stroke);border-radius:4px;margin:0;display:grid;place-items:center}
.cmp input:checked{background:var(--black);border-color:var(--black)}
.cmp input:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
@media (max-width:560px){.pcard h3{font-size:14.5px}.pcard .sub{font-size:12px}.price{font-size:16px}.pcard .btn{height:36px;font-size:13px;padding:0 8px}}
.more{display:flex;justify-content:center;margin-top:36px}
.empty{grid-column:1/-1;background:var(--bg-gray);border-radius:16px;padding:30px;text-align:center}
.support-list{display:grid;gap:12px}
.sart{border:1px solid var(--divider);border-radius:16px;padding:18px;display:grid;gap:4px}

/* footer */
.site-foot{border-top:1px solid var(--divider);padding-block:36px 120px;font-size:12px;color:var(--gray-text)}

@media (max-width:760px){.site-foot .cols{grid-template-columns:repeat(2,1fr)}}

/* bottom: compare tray + ask bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;display:grid;justify-items:center;gap:8px}
.dock>*{pointer-events:auto;width:100%;max-width:760px}
.tray{background:var(--white);border:1px solid var(--divider);border-radius:16px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.08);flex-wrap:wrap}
.tray .th{display:flex;gap:6px}
.tray .th span{width:42px;height:42px;border-radius:8px;background:var(--bg-gray);display:grid;place-items:center}
.tray .th svg{width:80%;height:80%}
.tray .tt{flex:1;min-width:120px;font-size:13px}
.tray .tt b{display:block;font-size:14px}
.ask{background:var(--white);border:1px solid var(--divider);border-radius:30px;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 18px;box-shadow:0 8px 28px rgba(0,0,0,.12)}

.ask input{flex:1;min-width:0;border:0;outline:0;font-size:16px;padding:10px 0;font-family:inherit;background:transparent}
.ask .send{width:42px;height:42px;border-radius:50%;border:0;background:var(--divider);display:grid;place-items:center;flex:none}
.ask .send.ready{background:var(--black);color:#fff}
.ask .send svg{width:18px;height:18px}
.ask .mic{background:none;border:0;padding:6px;display:grid;place-items:center}
.ask .mic svg{width:20px;height:20px}
.disc{font-size:11px;color:var(--gray-text);text-align:center;background:rgba(255,255,255,.9);border-radius:8px;padding:2px 6px;justify-self:center;width:auto!important}

.snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--snack);color:#fff;border-radius:6px;padding:12px 16px;display:flex;gap:18px;align-items:center;z-index:70;font-size:14px;max-width:calc(100% - 32px);animation:fade .25s}
.snack button{background:none;border:0;color:#fff;font-weight:700;text-decoration:underline;padding:0}

/* design notes side sheet */
.ns-scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80}
.ns{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--white);z-index:81;overflow:auto;padding:28px 28px calc(40px + env(safe-area-inset-bottom,0px));animation:slide .25s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.ns h2{font-family:var(--display);font-size:28px;margin:0 0 6px}
.ns h3{font-size:16px;margin:26px 0 10px}
.ns p,.ns li{font-size:14px;line-height:1.55}
.ns ol,.ns ul{padding-left:20px;display:grid;gap:6px}
.ns table{width:100%;border-collapse:collapse;font-size:13px}
.ns td,.ns th{border-top:1px solid var(--divider);padding:8px 6px;text-align:left;vertical-align:top}
.ns th{font-weight:700}
.ns .x{position:absolute;right:16px;top:16px}
.ns .tw{overflow-x:auto}

/* ---- v2: layouts */
.proto .seg{display:inline-flex;gap:4px;align-items:center;margin-right:10px;padding-right:12px;border-right:1px solid #333}
.proto .seg>span{margin-right:4px}
.proto button.on{background:#fff;color:#000;border-color:#fff;font-weight:700}
.ctitle{display:flex;gap:12px;align-items:baseline;justify-content:space-between;padding-top:14px;font-size:14px;min-width:0}

.ctop{position:sticky;top:var(--gnbh,82px);z-index:20;background:var(--white);border-bottom:1px solid var(--divider)}
.csticky{position:sticky;top:var(--gnbh,82px);z-index:20;background:var(--white)}
.fbar{display:flex;gap:8px;align-items:center;padding-block:12px;overflow-x:auto;scrollbar-width:none}

.fbtn{flex:none;border:1px solid var(--divider);background:var(--white);border-radius:20px;padding:7px 12px 7px 14px;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}

.fdiv{width:1px;height:22px;background:var(--divider);flex:none}
.fsp{flex:1;min-width:8px}
.fmenu{position:fixed;z-index:95;background:var(--white);border:1px solid var(--divider);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;min-width:230px;display:grid}
.fmenu button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:6px;font-size:14px;display:flex;gap:10px;align-items:center}
.fmenu button:hover{background:var(--bg-gray)}
.fmenu i{width:18px;height:18px;border:1px solid var(--stroke);border-radius:50%;flex:none;display:grid;place-items:center}
.fmenu button.on{font-weight:700}
.fmenu button.on i{border:6px solid var(--black)}
.fmenu button.multi i{border-radius:4px}
.fmenu button.multi.on i{border:0;background:var(--black)}
.fmenu button.multi.on i::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.thread{max-width:1120px;margin:0 auto;padding-block:28px 240px;display:grid;gap:44px}
.turn{display:grid;align-content:start;gap:16px;scroll-margin-top:calc(var(--gnbh,82px) + 120px);min-width:0}
.ubub{justify-self:end;background:var(--bg-gray);border-radius:20px 20px 4px 20px;padding:11px 18px;font-size:16px;max-width:min(560px,85%)}
.abub{display:grid;gap:10px;min-width:0}
.who{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
.ans{min-width:0}
.next h5,.side h5{font-size:14px;font-weight:700;margin:6px 0 10px}
.next .chips .chip{display:flex;gap:8px;align-items:center}

.human{margin-top:16px;padding-top:12px;border-top:1px solid var(--divider);font-size:13px}
.next .human{border-top:0;padding-top:0;margin-top:12px}
.note{font-size:12px;color:var(--gray-text);margin:6px 0 0}
.prow-h{display:flex;gap:10px;align-items:baseline;margin:24px 0 12px}
.prow-h b{font-size:15px}
.prow-h span{color:var(--gray-text);font-size:13px}
.prow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.mcard{background:var(--white);border:1px solid var(--divider);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:5px;min-width:0;scroll-snap-align:start}
.mcard:hover{border-color:var(--black)}

.mcard .im .tag{position:absolute;left:8px;top:8px;margin:0;background:var(--white)}
.mcard h4{margin:0;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .sub{margin:0;font-size:12px;color:var(--gray-text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .rt{font-size:12px;display:flex;gap:4px;align-items:center}
.mcard .rt svg{width:12px;height:12px}
.mcard .price{font-size:15px;margin-top:auto;padding-top:6px}
.mcard .price s{font-size:12px}
.mcard .btn{height:34px;font-size:13px;width:100%;margin-top:4px}
.mcard .cmp{font-size:12.5px;margin-top:4px}
.prow-more{display:flex;gap:18px;align-items:center;margin-top:16px;flex-wrap:wrap}
@media (max-width:1100px){.prow:not(.expanded){grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(180px,32%);overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.prow.expanded{grid-template-columns:repeat(3,minmax(0,1fr))}}

.reslink{display:flex;gap:10px;align-items:center;background:var(--white);border:1px solid var(--divider);border-radius:12px;padding:10px 14px;margin-top:14px;font-size:14px;text-align:left;width:100%}

.mseg{display:none}
.split{display:grid;grid-template-columns:minmax(360px,34%) minmax(0,1fr)}
.sp-chat{position:sticky;top:var(--gnbh,82px);height:calc(100vh - var(--gnbh,82px));display:flex;flex-direction:column;border-right:1px solid var(--divider);background:var(--white);min-width:0}
.sp-head{display:flex;gap:8px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--divider);font-size:15px}

.sp-thread .turn{gap:12px}

.sp-thread .bul{font-size:14.5px}
.sp-thread .q{display:none}
.sp-thread .ubub{font-size:14.5px}
.sp-thread .spec-wrap table.spec{min-width:0;font-size:13px}

.sp-thread .rv{grid-template-columns:110px 1fr 40px;font-size:13px}
.sp-thread .handoff .tx{min-width:0}
.sp-ask{padding:10px 16px 16px;border-top:1px solid var(--divider);background:var(--white)}

.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 18px;margin-top:10px}
.rgrid.five{grid-template-columns:repeat(5,minmax(0,1fr));gap:32px 16px}
.rgrid.five .pcard h3{font-size:15px}
.rgrid.five .pcard .btn{font-size:13px;padding:0 8px}
.feat-card{grid-column:span 2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;background:var(--bg-gray);border-radius:16px;padding:22px;align-items:center;transition:box-shadow .3s}
.feat-card.flash,.pcard.flash{box-shadow:0 0 0 2px var(--blue)}
.feat-card{align-self:start}
.feat-card .im{background:var(--white);border-radius:var(--r-card);aspect-ratio:1;display:grid;place-items:center;max-width:100%;width:100%;max-height:300px;justify-self:center}
.thread .turn:last-child{min-height:calc(100vh - var(--gnbh,82px) - 160px)}

.feat-card .rt{display:flex;gap:4px;align-items:center;font-size:13px;margin-bottom:10px}
.feat-card .rt svg{width:13px;height:13px}
.feat-card .price{font-size:22px}

.fbtns{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.res-head{padding-block:28px 6px;font-size:15px}

@media (max-width:1200px){.rgrid.five{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1000px){
  .mseg{display:flex;position:sticky;top:var(--gnbh,56px);z-index:20;background:var(--white);padding:10px 16px;gap:8px;border-bottom:1px solid var(--divider)}
  .mseg button{flex:1;border:1px solid var(--divider);background:var(--white);border-radius:20px;height:38px;font-weight:700;display:inline-flex;gap:6px;align-items:center;justify-content:center}
  .mseg button svg{width:14px;height:14px}
  .mseg button.on{background:var(--black);color:var(--white);border-color:var(--black)}
  .split{grid-template-columns:minmax(0,1fr)}
  .sp-chat{position:static;height:auto;border:0}
  .sp-head{display:none}
  .split.pane-chat .sp-res,.split.pane-res .sp-chat{display:none}
  .sp-thread{padding:16px 16px 20px;overflow:visible}

  .rs{padding:0 16px 40px}
  .dock.right{justify-items:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ==== v4: matched to live samsung.com measurements (captured Oct 2026, 1440 and 390 wide) ==== */
:root{--display:"SamsungSharpSans","Outfit",arial,sans-serif;--body:"SamsungOne","Noto Sans",arial,sans-serif;--chip-line:#BBBBBB;--gray-text:#757575}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.33}
.wrap{padding-inline:24px}
@media (max-width:760px){.wrap{padding-inline:24px}}

/* GNB: 106px desktop, 64px mobile */
.gnb{border-bottom:0}
.gnb .wrap{position:relative}
.util{position:absolute;right:24px;top:14px;padding:0;gap:22px;font-family:var(--display);font-size:14px;font-weight:700;line-height:20px}
.util span{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.gnb-row{height:106px;padding-top:32px;gap:0}
.logo{display:block;height:43px;padding:7px 0;margin-right:40px;flex:none}
.logo{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.115em;line-height:29px;color:#000}
.nav{gap:0;font-family:var(--body);font-size:16px;font-weight:700;line-height:20px}
.nav span{padding:12px 12px 16px;margin-top:4px}
.nav span:hover{text-decoration:underline;text-underline-offset:6px}
.icons{gap:4px}
.ibtn{width:40px;height:40px;padding:8px}
.ibtn svg{width:24px;height:24px}
.ibtn:hover{background:none;opacity:.6}
@media (max-width:1000px){
  .gnb-row{height:64px;padding-top:0;gap:0}
  .gnb .wrap{padding-inline:8px}
  .logo{margin-right:auto;padding:7px 4px}
  .logo{font-size:19px;line-height:29px}
  .burger{order:5}
}

/* search popup: measured input 36px SamsungOne 700 (24px on phones), 14px 700 gray list titles */
.pop{padding-block:32px 48px}
.pop-head{gap:6px;padding-bottom:26px}
.pop-head>svg{width:28px;height:28px}
.pop-head input{font-family:var(--body);font-weight:700;font-size:36px;line-height:46px;height:46px;padding:0 2px;color:#000}
.pop-head input::placeholder{color:#8f8f8f}
.pop-head .clr-btn{font-family:var(--display);font-weight:700;font-size:14px;background:none;border:0;border-bottom:1px solid #000;padding:0 0 2px;margin-right:22px}
.pop-body{grid-template-columns:340px 1fr;gap:48px;padding-top:30px}
.eyebrow{font-family:var(--body);font-size:14px;font-weight:700;color:#757575;letter-spacing:0;margin:0 0 22px}
.eyebrow.tc{text-transform:none}
.recent{background:#F4F4F4;border-radius:20px;padding:8px 14px;font-size:14px;font-weight:700;margin-bottom:30px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.plist button{background:none;border:0;padding:0;font-size:14px;font-weight:700;text-align:left}
.plist button:hover{text-decoration:underline}
.recs{gap:12px}
.rec .im{border-radius:8px;background:#F4F4F4}
.rec .im img{width:100%;height:100%;object-fit:contain}
.rec b{font-family:var(--body);font-weight:700;font-size:20px;line-height:29px;margin-top:20px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec.one b{-webkit-line-clamp:1;display:block;white-space:nowrap;text-overflow:ellipsis}
.rec span{display:block;font-size:16px;font-weight:700;margin-top:10px}
.sugg{gap:10px}
.sugg button{padding:0;font-size:14px;line-height:21px;border-radius:0;align-items:flex-start}
.sugg button:hover,.sugg button.on{background:none;text-decoration:underline}
.sugg .in{color:#757575}
.sugg .ask{color:#000;font-weight:700;margin-bottom:6px}
.sugg .ask svg{margin-top:2px;color:var(--blue-press)}
@media (max-width:760px){
  .pop{padding-block:16px 24px}
  .pop-head input{font-size:24px;line-height:32px;height:32px}
  .pop-body{grid-template-columns:1fr;gap:28px;padding-top:20px}
  .rec b{font-size:16px;line-height:22px;margin-top:12px}
  .rec span{font-size:14px}
}

/* search page header: "Results for" row 70px, 16px with bold keyword */
.ctitle{min-height:70px;align-items:center;padding-top:0;font-size:16px}
.ctitle b{font-weight:700}
.ctitle .cnt{color:#000;font-size:16px}
.ctitle .cnt b{font-weight:700}
.ctop{border-bottom:1px solid #DDDDDD}
.fbar{padding-block:0 18px;gap:8px}
.fbtn{height:40px;border:1px solid var(--chip-line);border-radius:20px;padding:0 14px 0 16px;font-size:14px;font-weight:700;line-height:20px;color:#000}
.fbtn.on{border-color:#000;background:#fff;color:#000}
.fbtn.plain{border-color:transparent;padding-right:0;font-size:16px}

.fbtn svg{width:16px;height:16px}
.fdiv{height:24px;background:#DDDDDD}
.linkbtn{font-family:var(--display);font-size:14px;text-underline-offset:5px;text-decoration-thickness:1px}
.fmenu button{font-size:16px}
@media (max-width:760px){.ctitle{min-height:50px;font-size:17px}.fbar{padding-bottom:14px}}

/* product card: image box #F7F7F7 r8, 216/314 image, 22px title, 32px swatches, 36px r4 chips, 40px r20 CTAs */
.rgrid{gap:40px 36px;margin-top:4px}
.pcard{gap:0}
.pcard .im{background:#F7F7F7;border-radius:8px;aspect-ratio:314/312;margin-bottom:24px}
.pcard .im img,.mcard .im img,.feat-card .im img,.pick .im img,.tray .th img{width:69%;height:69%;object-fit:contain}
.im img,.cat img,.hero .art img{mix-blend-mode:multiply}
.hero{background:#F4F4F4;color:#000;padding-block:56px}
.hero h1{font-size:clamp(32px,4.4vw,56px)}
.hero .btn.inv{background:#000;color:#fff;border-color:#000}
.hero .btn.ghost-inv{color:#000;border-color:#000}

function mcardHTML(p,tag){

function productsBlock(t,i){
  if(!t.hasProducts) return '';

  const n=t.ids.length, sh=Math.min(t.shown,n);
  return `<div class="prow-h"><b>${t.a.table?'In this comparison':t.a.popular?'Most popular':n<=5?`${n} match${n>1?'es':''}`:'Top 5 for you'}</b>${t.a.popular?'<span>Sorted by ratings and reviews</span>':''}${n>5?`<span>${sh} of ${n} shown</span>`:''}</div>

function resultsGrid(list,mode){

  const sh=Math.min(S.resShown,list.length);

  return `<div class="rgrid ${mode}">${items}</div>${sh<list.length?`<div class="more"><button class="btn" data-resmore>View more (${list.length-sh})</button></div>`:''}`;
}

/* ---------- answer pieces, shared by all three layouts */
function md(s){return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}
function plain(s){return (s||'').replace(/\*\*/g,'')}
const titleQ=()=>S.query.replace(/\b\w/g,c=>c.toUpperCase());
function restHTML(t,i,withProducts){
  const a=t.a; let h='';
  if(a.ask&&i===S.turns.length-1) h+=`<div class="clarify reveal"><b>${esc(a.ask.q)}</b><div class="copts">${a.ask.opts.map(([l,q])=>`<button class="copt" data-ask="${esc(q)}">${esc(l)}</button>`).join('')}</div></div>`;
  if(a.bullets?.length) h+=`<ul class="bul reveal">${a.bullets.map(b=>`<li>${md(b)}</li>`).join('')}</ul>`;
  if(a.steps) h+=`<ol class="stepper reveal">${a.steps.map((s,k)=>`<li class="${k===0?'cur':''}"><span class="n">${k+1}</span><div><b>${esc(s[0])}</b><p>${esc(s[1])}</p></div></li>`).join('')}</ol>${a.fixq?`<div class="fixq reveal">Did this fix it? <button class="btn" data-fix="yes">Yes</button><button class="btn" data-ask="Still not working">No, talk to support</button></div>`:''}`;
  if(a.reviews) h+=`<div class="reviews reveal">${a.reviews.map(([k,v])=>`<div class="rv"><span>${k}</span><span class="bar"><i style="width:${v}%"></i></span><em>${v}%</em></div>`).join('')}</div><p class="note">Share of reviews that mention each topic positively.</p>${a.quote?`<blockquote class="quote reveal">"${esc(a.quote.t)}"<cite>${esc(a.quote.c)}</cite></blockquote>`:''}`;
  if(a.table) h+=`<div class="spec-wrap reveal"><table class="spec"><thead><tr><th></th>${a.table.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${a.table.rows.map(([k,vals,win])=>`<tr><th>${k}</th>${vals.map((v,j)=>`<td class="${win[j]&&vals.length>1?'win':''}">${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(a.handoff) h+=`<div class="handoff reveal"><span class="av">S</span><div class="tx"><b>Samsung Specialist</b><span>Usually replies in under 2 minutes · 8am–12am ET</span></div><div class="act"><button class="btn fill" data-toast="Chat opened with your conversation attached">Start chat</button><button class="btn" data-toast="Call 1-800-SAMSUNG (1-800-726-7864)">Call us</button></div></div>`;
  if(S.layout==='answer'&&a.picks?.length) h+=`<div class="picks-h reveal">${a.table?'In this comparison':'Top picks for you'}</div><div class="picks reveal">${a.picks.map(id=>{const p=byId[id];return `<button class="pick" data-goto="${id}"><span class="im">${art(p)}</span><span><span class="tag">${esc((a.tags||{})[id]||'Pick')}</span><h4>${esc(p.name)}</h4><p class="why">${esc(p.sub||p.color)}</p><span class="pr">${fmt(p.price)}${p.was?`<s>${fmt(p.was)}</s>`:''}</span></span></button>`}).join('')}</div>`;
  if(S.layout==='split'&&t.hasProducts&&t.ids.length) h+=`<button class="reslink reveal" data-pane="res">${I.sparkLine}<span><b>${t.ids.length} ${CAT_LABEL[S.cat]||'products'}</b> updated in results</span></button>`;
  if(withProducts) h+=`<div class="reveal">${productsBlock(t,i)}</div>`;
  if(a.sources?.length) h+=`<div class="src reveal"><b>Sources</b>${a.sources.map(s=>{const o=srcLink(s);return `<a href="${esc(o.u)}" target="_blank" rel="noopener" title="${esc(o.u)}">${esc(o.t)}</a>`}).join('')}</div>`;
  h+=`<div class="foot reveal"><span>Was this helpful?</span><button class="thumb" data-thumb="up" aria-label="Helpful">${I.thumbUp}</button><button class="thumb" data-thumb="down" aria-label="Not helpful">${I.thumbDn}</button>${S.layout!=='split'?'<span>AI answers can make mistakes. Prices and offers come from samsung.com.</span>':''}</div>`;
  return h;
}
function nextHTML(a){
  return `${a.chips?.length?`<h5>Ask next</h5><div class="chips">${a.chips.map(c=>`<button class="chip" data-ask="${esc(c)}">${I.sparkLine}${esc(c)}</button>`).join('')}</div>`:''}
    <div class="human">Need a person? <button class="linkbtn" data-ask="Talk to a specialist">Chat with a Samsung specialist</button></div>`;
}
function fillTurn(t,i,ansEl,nextEl,withProducts,animate){
  const a=t.a;
  const done=()=>{ansEl.innerHTML=`<p class="lead">${md(a.lead||'')}</p>`+restHTML(t,i,withProducts); if(nextEl) nextEl.innerHTML=i===S.turns.length-1?nextHTML(a):''};
  if(!animate||reduce||t.painted||t.animating){ if(t.animating){t.cancel=true;t.animating=false;S.busy=false} t.painted=true; done(); return }
  t.animating=true; S.busy=true; renderDock();
  const steps=a.think||[];
  ansEl.innerHTML=`<div class="lin"><i></i></div><div class="thinking">${steps.map(s=>`<div class="think" style="visibility:hidden"><span class="dot"></span>${esc(s)}</div>`).join('')}</div>`;
  if(nextEl) nextEl.innerHTML='';
  const nodes=[...ansEl.querySelectorAll('.think')]; let k=0;
  const keepDown=()=>{const th=document.getElementById('spThread'); if(th) th.scrollTop=th.scrollHeight};
  const tick=()=>{ if(t.cancel) return; nodes.forEach((n,j)=>{if(j<=k) n.style.visibility='visible'}); if(k>0) nodes[k-1].classList.add('done'); keepDown(); if(k<nodes.length){k++;setTimeout(tick,430)} else setTimeout(stream,180) };
  tick();
  function stream(){
    if(t.cancel) return;
    const words=(a.lead||'').split(' '); let w=0;
    ansEl.innerHTML=`<p class="lead"><span class="st"></span><span class="cursor"></span></p>`;
    const st=ansEl.querySelector('.st');
    const iv=setInterval(()=>{
      if(t.cancel){clearInterval(iv);return}
      w+=2; st.innerHTML=md(words.slice(0,w).join(' ')); keepDown();
      if(w>=words.length){clearInterval(iv); t.animating=false; t.painted=true; S.busy=false; done(); keepDown(); renderDock();
        if(t.filtersChanged&&S.layout!=='chat'&&t.hasProducts) snack(`Results updated to ${visibleProducts().length} ${CAT_LABEL[S.cat]||'products'}`,()=>{S.filters=t.prevFilters;resnap();refresh()});}
    },45);
  }
}
function fillAll(){
  const last=S.turns.length-1;
  S.turns.forEach((t,i)=>{const a=document.querySelector(`[data-ans="${i}"]`); if(!a) return; fillTurn(t,i,a,document.querySelector(`[data-next="${i}"]`),S.layout==='chat',i===last)});
}

function startSearch(q){
  closePop();
  S.turns.forEach(t=>{if(t.animating){t.cancel=true;t.animating=false}}); S.busy=false;
  S.query=q; S.turns=[]; S.tags={}; S.lastPicks=null; S.compare=[]; S.sort='rel'; S.aiCollapsed=false;
  S.filters=EMPTY(); S.aiKeys=new Set(); S.resShown=5; S.pane='chat'; S.draft='';
  S.cat=detectCat(fixTypos(q.toLowerCase()))||null;
  S.view='search'; scrollTo({top:0});
  ask(q,true);
}
function newSearch(){
  S.turns.forEach(t=>{if(t.animating){t.cancel=true;t.animating=false}}); S.busy=false;
  S.query=''; S.turns=[]; S.tags={}; S.lastPicks=null; S.compare=[]; S.sort='rel'; S.filters=EMPTY(); S.aiKeys=new Set(); S.draft=''; S.cat=null;
  S.view='search'; render(); scrollTo({top:0}); document.getElementById('askIn')?.focus();
}
function ask(q,isInitial){
  if(S.busy) return;
  if(!KB.ready){S.view='search'; dock.hidden=true; app.innerHTML=`<div class="wrap" style="padding-block:48px 400px"><div class="think"><span class="dot"></span>Loading samsung.com knowledge base</div></div>`; KB.wait.then(()=>ask(q,isInitial)); return}
  const a=respond(q);
  const prev=clone(S.filters);
  if(a.cat&&a.cat!==S.cat){S.cat=a.cat;S.filters=EMPTY();S.tags={};S.aiKeys=new Set()}
  if(a.filters){
    const nf={...S.filters,...a.filters,styles:a.filters.styles||S.filters.styles||[]};
    for(const k of Object.keys(a.filters)){const v=nf[k]; if(k!=='aiIds'&&k!=='people'&&v!=null&&!(Array.isArray(v)&&!v.length)&&JSON.stringify(v)!==JSON.stringify(prev[k])) S.aiKeys.add(k)}
    S.filters=nf;
  }
  if(a.picks?.length){S.lastPicks=a.picks;S.tags={...(a.tags||{})}}
  const t={q,a,prevFilters:prev}; snap(t);
  t.filtersChanged=JSON.stringify(prev)!==JSON.stringify(S.filters);
  S.turns.push(t); S.aiCollapsed=false; S.resShown=5;
  if(S.layout==='split') S.pane='chat';
  S.view='search'; renderSearch(); renderDock(); markLayout();
  if(!isInitial&&S.layout==='chat') document.getElementById('turn-'+(S.turns.length-1))?.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
  if(!isInitial&&S.layout==='answer') document.getElementById('ai')?.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
}
let snackT;
function snack(msg,undo){
  document.querySelectorAll('.snack').forEach(s=>s.remove());
  const d=document.createElement('div'); d.className='snack'; d.setAttribute('role','status');
  d.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>Undo</button>':''}`;
  if(undo) d.querySelector('button').onclick=()=>{undo();d.remove()};
  document.body.appendChild(d); clearTimeout(snackT); snackT=setTimeout(()=>d.remove(),4500);
}

function popBody(v){

  const card=(p,price,one)=>`<button class="rec ${one?'one':''}" data-q="${esc(p.name.toLowerCase())}"><span class="im">${art(p)}</span><b>${esc(p.name)}</b><span>${fmt(price??p.price)}</span></button>`;

    b.innerHTML=`<div><p class="eyebrow">Recent searches</p><button class="recent" data-q="galaxy z fold8 ultra">Galaxy Z Fold8 Ultra <i>✕</i></button>
      <p class="eyebrow">Popular searches</p><ul class="plist">${['Galaxy Z Fold8 Ultra','Galaxy Z Fold8','Galaxy Z Flip8','Galaxy Watch9'].map(s=>`<li><button data-q="${esc(s.toLowerCase())}">${s}</button></li>`).join('')}</ul></div>
      <div><p class="eyebrow">Recommended</p><div class="recs">${recs.map(([p,pr])=>card(p,pr,1)).join('')}</div></div>`;
    return;
  }
  const lv=v.toLowerCase().trim();
  const hits=SUGG.filter(s=>s.toLowerCase().includes(lv)).slice(0,5);
  const isQ = lv.split(/\s+/).length>=3 || /\?|best|which|vs|how|what|for /.test(lv);
  const hl=s=>{const i=s.toLowerCase().indexOf(lv);return i<0?esc(s):esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+lv.length))+'</mark>'+esc(s.slice(i+lv.length))};
  const words=lv.split(/\s+/);
  const rel=P.filter(p=>words.every(w=>p.name.toLowerCase().includes(w))||detectCat(lv)===p.cat).sort((x,y)=>score(y)-score(x)).slice(0,4);
  b.innerHTML=`<div><p class="eyebrow tc">Suggested Searches</p><ul class="sugg">
    ${isQ?`<li><button data-q="${esc(v)}" class="ask">${I.sparkLine}<span>Ask Samsung AI: ${esc(v)}</span></button></li>`:''}
    ${hits.map(s=>`<li><button data-q="${esc(s.toLowerCase())}"><span>${hl(s)} <span class="in">in Products</span></span></button></li>`).join('')}
    ${!isQ&&!hits.length?`<li><button data-q="${esc(v)}"><span><mark>${esc(v)}</mark> <span class="in">in Products</span></span></button></li>`:''}
  </ul></div>${rel.length?`<div><p class="eyebrow">Related products</p><div class="recs">${rel.map(p=>card(p)).join('')}</div></div>`:''}`;
}
function closePop(){layer.innerHTML='';S.sheet=false}

/* design notes */
function openNotes(){
  layer.innerHTML=`<div class="ns-scrim" data-close-pop></div><aside class="ns" role="dialog" aria-label="Design notes">
  <button class="ibtn x" data-close-pop aria-label="Close">${I.close}</button>
  <h2>Design notes</h2>
  <p>A conversational layer for the samsung.com search page. The GNB search popup stays exactly as it is today. The AI lives on the results page, above the grid shoppers already know, and every answer updates the grid underneath it.</p>
  <h3>The search page is a conversation</h3>
  <p>Filters sit in a bar at the top, with a set for each category (series, storage and S Pen for phones; type, size, resolution and year for TVs). Filters the AI sets are marked with a sparkle, and changing one by hand updates the latest answer's products. Broad searches like "refrigerator" or "tv" get a short question with tap answers instead of a guess, and the cards underneath are labelled "Most popular". Product cards appear when the question is about products, and general how-to answers stay text-only.</p>
  <h3>Where the answers come from</h3>
  <p>The prototype loads a knowledge base crawled from samsung.com in October 2026: ${KB.products.length||372} product pages, ${KB.faqs.length||665} FAQs and ${KB.chunks.length||'7,500+'} passages from support articles and buying guides. Questions are matched to passages with keyword ranking (BM25). The answer quotes the best passage and links every page it used. If no page covers the question, it says so instead of guessing. Shopping requests are ranked on the data: refrigerator dimensions and capacities, phone screen, camera, battery and weight from samsung.com spec pages, and TV type, size and resolution. Comparisons pick up every model named (up to four). In production this would be an embedding index plus an LLM that writes from the retrieved passages, with prices read live from samsung.com.</p>
  <h3>How conversational product search works</h3>
  <ol>
    <li><b>Understand intent.</b> Classify the query: a product name (navigational), a need ("fridge for a family of 5"), a comparison, or a support problem.</li>
    <li><b>Retrieve.</b> Pull matching products, specs, offers, reviews and support articles from the samsung.com catalog and knowledge base.</li>
    <li><b>Ground and answer.</b> Write a short answer only from what was retrieved. Prices and offers are inserted from live data, never generated.</li>
    <li><b>Render as UI.</b> Turn the answer into Samsung components: product picks, spec rows, steppers, filter chips.</li>
    <li><b>Refine.</b> Each follow-up keeps context and updates both the answer and the filtered results.</li>
  </ol>
  <h3>What we took from the best examples</h3>
  <div class="tw"><table><tr><th>Who</th><th>Pattern</th><th>Here</th></tr>
  <tr><td>Google AI Mode</td><td>Answer first, visible reasoning steps, cited sources, follow-up box, comparison tables</td><td>Thinking steps, Sources row, pinned ask bar, spec table</td></tr>
  <tr><td>Amazon Rufus</td><td>Lives inside normal search, suggested questions, review summaries, compare</td><td>"Ask next" chips, review breakdown, grid stays below</td></tr>
  <tr><td>Shop / Shopify</td><td>Natural language turned into filters; products shown inside the answer</td><td>"Set from your conversation" filter chips, Top picks</td></tr>
  <tr><td>Best Buy, Walmart</td><td>Hand off to a person with context; AI disclosure</td><td>Specialist card, Beta label and info tooltip</td></tr>
  </table></div>
  <h3>Rules this prototype follows</h3>
  <ul>
    <li><b>Match the query.</b> A product name like "galaxy s26 ultra" gets the normal results, with the ask bar ready if they want help. Needs, comparisons and problems get a full answer.</li>
    <li><b>One source of truth.</b> AI filters show up as removable chips and in the left filter panel. Undo is always one tap away.</li>
    <li><b>Never a dead end.</b> Every answer ends with next questions and a way to reach a person.</li>
    <li><b>Disclose.</b> A Beta label, an info tooltip, and a line under the ask bar.</li>
  </ul>
  <h3>Samsung components used</h3>
  <div class="tw"><table><tr><th>Need</th><th>Component</th></tr>
  <tr><td>Results tabs</td><td>Tab / Standard / Primary</td></tr>
  <tr><td>Pick labels</td><td>Tag / badge</td></tr>
  <tr><td>Comparison</td><td>Spec / Standard, white and gray rows</td></tr>
  <tr><td>Support steps</td><td>Stepper (current step in #006BEA)</td></tr>
  <tr><td>Thinking</td><td>Progress / Linear in #2189FF</td></tr>
  <tr><td>Results changed</td><td>Snackbar with Undo</td></tr>
  <tr><td>AI disclosure</td><td>Tooltip / Marked, white</td></tr>
  <tr><td>Buttons</td><td>39px, 20px radius, filled and outlined</td></tr>
  </table></div>
  <h3>New components this needs</h3>
  <p>Ask bar, answer container, thinking indicator, source chip, feedback control, history row. Everything else already exists in the design system.</p>
  <p style="color:var(--gray-text);font-size:12px">Products and prices are mocked from samsung.com in October 2026. Product images are drawn placeholders because live images can't load here. Fonts fall back to Outfit and Noto Sans when SamsungOne and Samsung Sharp Sans aren't installed.</p>
  </aside>`;
}

/* ------------------------------------------------------------------ events */
document.addEventListener('click',e=>{
  if(e.target.closest('#popClear')){const i=document.getElementById('popIn'); i.value=''; popBody(''); i.focus(); return}
  const menu=document.getElementById('fmenu');
  if(menu&&!e.target.closest('#fmenu')&&!e.target.closest('[data-fmenu]')) closeMenu();
  const t=e.target.closest('button,[data-close-pop],label,input'); if(!t) return;
  if(t.matches('[data-run]')){const v=t.dataset.run; if(v==='home'){closePop();S.view='home';render();scrollTo({top:0});setTimeout(openPop,250)} else startSearch(v); return}
  if(t.id==='openNotes'){openNotes();return}
  if(t.id==='logo'){closePop();go('home');return}
  if(t.id==='openSearch'){openPop();return}
  if(t.matches('[data-close-pop]')){closePop();return}
  if(t.matches('[data-q]')){startSearch(t.dataset.q);return}
  if(t.matches('[data-ask]')){if(S.busy)return; closePop(); ask(t.dataset.ask); return}
  if(t.matches('[data-fmenu]')){const k=t.dataset.fmenu; if(menu&&menu.dataset.key===k){closeMenu();return} openMenu(t,k); return}
  if(t.matches('[data-fset]')){const multi=!!t.parentElement.dataset.multi, key=t.dataset.fset; setFilter(key,t.dataset.v,multi); if(!multi) closeMenu(); else {const b=document.querySelector(`[data-fmenu="${key}"]`); if(b) openMenu(b,key)} return}
  if(t.matches('[data-ftoggle]')){const k=t.dataset.ftoggle,prev=clone(S.filters); S.filters[k]=S.filters[k]?null:true; S.aiKeys.delete(k); afterManual(prev); return}
  if(t.id==='clearAll'){const prev=clone(S.filters); S.filters=EMPTY(); S.aiKeys=new Set(); afterManual(prev); return}
  if(t.matches('[data-more]')){S.turns[+t.dataset.more].shown+=5; refresh(); return}
  if(t.matches('[data-all]')){openAll(); return}
  if(t.matches('[data-resmore]')){S.resShown+=5; refresh(); return}
  if(t.matches('[data-pane]')){S.pane=t.dataset.pane; renderSearch(); renderDock(); scrollTo({top:0}); return}
  if(t.matches('[data-goto]')){const el=document.getElementById('c-'+t.dataset.goto); if(el){el.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1600)} return}
  if(t.matches('[data-h]')){const turn=S.turns[+t.dataset.h]; snack(`Earlier answer: ${plain(turn.a.lead).slice(0,110)}…`); return}
  if(t.id==='newChat'){newSearch();return}
  if(t.id==='tocBtn'){S.tocOpen=!S.tocOpen;document.querySelector('.toc')?.classList.toggle('open',S.tocOpen);t.setAttribute('aria-expanded',S.tocOpen);return}
  if(t.matches('[data-jump]')){S.tocOpen=false;document.querySelector('.toc')?.classList.remove('open');t.blur();document.getElementById('turn-'+t.dataset.jump)?.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});return}
  if(t.id==='collapseAI'){S.aiCollapsed=true; refresh(); return}
  if(t.id==='expandAI'){S.aiCollapsed=false; S.turns[S.turns.length-1].painted=true; refresh(); return}
  if(t.id==='aiInfo'){const w=t.parentElement; const ex=w.querySelector('.tip-box'); if(ex){ex.remove();return} w.insertAdjacentHTML('beforeend',`<div class="tip-box">Samsung AI answers from samsung.com product pages, specs, reviews and support articles. It can make mistakes, so check details on the product page. Prices and offers are always pulled live.</div>`); return}
  if(t.matches('[data-thumb]')){t.parentElement.querySelectorAll('.thumb').forEach(b=>b.classList.remove('on')); t.classList.add('on'); snack(t.dataset.thumb==='up'?'Thanks for the feedback':'Thanks. Tell us what was wrong in the ask bar.'); return}
  if(t.matches('[data-toast]')){snack(t.dataset.toast);return}
  if(t.matches('[data-fix]')){snack('Great. Glad that fixed it.');return}
  if(t.id==='cmpClear'){S.compare=[]; refresh(); return}
  if(t.id==='cmpGo'){ask('Compare these');return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-cmp]')){const id=t.dataset.cmp; if(t.checked){if(S.compare.length>=3){t.checked=false;snack('You can compare up to 3 products');return} S.compare.push(id)} else S.compare=S.compare.filter(x=>x!==id); document.querySelectorAll(`[data-cmp="${id}"]`).forEach(c=>c.checked=t.checked); renderDock(); return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='popIn') popBody(e.target.value);
  if(e.target.id==='askIn'){S.draft=e.target.value; e.target.form.querySelector('.send').classList.toggle('ready',!!S.draft.trim())}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='popForm'){const v=document.getElementById('popIn').value.trim(); if(v) startSearch(v)}
  if(e.target.id==='askForm'){const v=S.draft.trim(); if(!v||S.busy) return; S.draft=''; if(!S.turns.length) startSearch(v); else ask(v)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePop();closeMenu()}});
addEventListener('scroll',()=>{closeMenu();updRail()},{passive:true});
addEventListener('resize',()=>{closeMenu(); if(S.view==='search') setTop()});

render();
setTimeout(()=>{if(S.view==='home'&&!layer.innerHTML) openPop()},600);
</script>
